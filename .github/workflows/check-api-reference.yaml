name: Check API reference

on:
  push:
    branches: ["main", "pre-release"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the API reference matches protos/kachaka-api.proto
        run: |
          if ! cmp -s protos/kachaka-api.proto docs/spec/kachaka-api.proto; then
            echo "::error::docs/spec/kachaka-api.proto differs from protos/kachaka-api.proto. Regenerate the API reference in docs/spec together with the proto."
            diff -u protos/kachaka-api.proto docs/spec/kachaka-api.proto || true
            exit 1
          fi
          test -f docs/spec/index.html
